pipelines:
  doc-to-pdf:
    label: "Als PDF exportieren"
    icon: "file-pdf"
    source_types:
      - "application/msword"
      - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
      - "application/vnd.oasis.opendocument.text"
      - "application/vnd.oasis.opendocument.spreadsheet"
      - "application/vnd.oasis.opendocument.presentation"
    shares:
      type: "parentDir"
    job:
      type: "doc-to-pdf"
      timeout: 120s
    target:
      extension: ".pdf"
      location: "same"
    notification: "toast"

  md-to-pdf:
    label: "Markdown als PDF"
    icon: "file-pdf"
    source_types:
      - "text/markdown"
      - "text/x-markdown"
    shares:
      type: "parentDir"
    job:
      type: "md-to-pdf"
      timeout: 60s
    target:
      extension: ".pdf"
      location: "same"
    notification: "toast"
