[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openworks-worker-cloud"
version = "0.2.0"
description = "OpenWorks cloud worker — zip, md-to-pdf, tar, unzip"
requires-python = ">=3.11"
dependencies = [
    "openworks-sdk",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
openworks-worker = "openworks_cloud.cli:main"
