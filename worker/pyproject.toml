[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openworks-worker"
version = "0.1.0"
description = "OpenWorks reference worker — pipelining of OpenCloud's Kosmos Edition"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
openworks-worker = "openworks.cli:main"
